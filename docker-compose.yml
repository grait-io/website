version: '3.8'

services:
  app:
    build: .
    environment:
      - NODE_ENV=production
    volumes:
      - ./.next/standalone/.next/static:/app/.next/static
      - ./public:/app/public
    ports:
      - "3210:3000"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./.next/standalone/.next/static:/usr/share/nginx/html/_next/static
      - ./public:/usr/share/nginx/html/static
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge